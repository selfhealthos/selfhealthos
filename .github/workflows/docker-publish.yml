name: Publish images

# Gated on CI passing first (see the `test` job below), so a broken push to
# main can never produce a tagged image. Runs on every push to main (tagged
# `latest` + the commit sha) and on version tags (also tagged with the
# version, for a pinnable release).
#
# Publishing is where this workflow stops. There is deliberately no deploy
# job: operators pull the new images and restart their own stack on their own
# schedule, which is what the README and CLAUDE.md have always described. An
# earlier version of this file did carry one, SSHing into a specific Oracle
# VM - it only ever failed, because the host secret was never set, and a
# permanently red workflow is worse than no workflow at all.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish-backend:
    name: Build & push backend
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/selfhealthos-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runner
          # linux/arm64 as well as amd64: a self-hosted stack lands on a
          # Raspberry Pi, an Ampere instance or an Apple Silicon Mac at least
          # as often as on an x86 box, and emulating amd64 on those is slow
          # enough that people notice.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-frontend:
    name: Build & push frontend
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/selfhealthos-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runner
          # linux/arm64 as well as amd64: a self-hosted stack lands on a
          # Raspberry Pi, an Ampere instance or an Apple Silicon Mac at least
          # as often as on an x86 box, and emulating amd64 on those is slow
          # enough that people notice.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
